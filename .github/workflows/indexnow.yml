name: IndexNow ping
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages deploy
        run: sleep 90
      - name: Submit sitemap URLs to IndexNow
        run: |
          KEY=1821708ce95f45b392a0993407586868
          URLS=$(grep -o '<loc>[^<]*</loc>' docs/sitemap.xml | sed 's#</\?loc>##g' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          BODY=$(printf '{"host":"agentkitdrawer.com","key":"%s","keyLocation":"https://agentkitdrawer.com/%s.txt","urlList":%s}' "$KEY" "$KEY" "$URLS")
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' -d "$BODY" https://api.indexnow.org/indexnow)
          echo "IndexNow HTTP $code"
          [ "$code" = 200 ] || [ "$code" = 202 ]
