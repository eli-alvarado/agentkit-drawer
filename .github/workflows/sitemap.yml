name: sitemap-lastmod
on:
  pull_request:
  push: {branches: [main]}
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # full history: lastmod is git-dated
      - run: python3 scripts/sitemap-lastmod.py --check
